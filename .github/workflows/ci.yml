# Runs on every push and pull request: installs, builds the app, and smoke-tests the MCP server.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run build
      - name: Smoke-test the MCP server
        run: node mcp/smoke-test.js
